[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "so101-world-model"
version = "0.1.0"
description = "World model for SO-101 robots: video generation + inverse dynamics → zero-shot manipulation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Core ML
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "einops>=0.7.0",
    "numpy>=1.26.0",

    # HuggingFace ecosystem
    "transformers>=4.44.0",
    "diffusers>=0.30.0",
    "huggingface_hub>=0.24.0",
    "datasets>=2.20.0",
    "accelerate>=0.33.0",
    "peft>=0.12.0",           # LoRA fine-tuning

    # Video / image processing
    "Pillow>=10.0.0",
    "imageio>=2.34.0",
    "imageio-ffmpeg>=0.5.0",
    "opencv-python>=4.9.0",
    "torchvision>=0.17.0",

    # Config & logging
    "omegaconf>=2.3.0",
    "wandb>=0.17.0",
    "tqdm>=4.66.0",
    "rich>=13.0.0",

    # Data
    "pyarrow>=16.0.0",
    "pandas>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]
robot = [
    "lerobot>=0.5.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["wm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
